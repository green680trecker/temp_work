{% extends 'main/layout.html' %}

{% block title %}
Регистрация
{% endblock %}

{% block body %}
<div class="container d-flex justify-content-center align-items-center vh-100">
    <form method="post" class="registration-form p-4 rounded shadow bg-white">
        {% csrf_token %}
        <h3 class="text-center mb-4">Регистрация</h3>

        <div class="mb-3">
            <label for="first_name" class="form-label">Имя</label>
            <input type="text" id="first_name" class="form-control custom-input" name="first_name" placeholder="Введите имя" required>
        </div>

        <div class="mb-3">
            <label for="last_name" class="form-label">Фамилия</label>
            <input type="text" id="last_name" class="form-control custom-input" name="last_name" placeholder="Введите фамилию" required>
        </div>

        <div class="mb-3">
            <label for="phone" class="form-label">Номер телефона</label>
            <input type="tel" id="phone" class="form-control custom-input" name="phone" placeholder="Введите номер" required>
        </div>

        <div class="mb-3">
            <label for="dob" class="form-label">Дата рождения</label>
            <input type="date" id="dob" class="form-control custom-input" name="dob" required>
        </div>

        <div class="d-flex justify-content-between align-items-center">
            <button type="submit" class="btn btn-secondary">Подтвердить</button>
            <a href="" class="text-decoration-none">Уже есть аккаунт?</a>
        </div>
    </form>
</div>
{% endblock %}
