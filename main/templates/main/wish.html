<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Продукти</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #999;
            padding: 8px;
            text-align: left;
        }
        th {
            background: #f4f4f4;
        }
    </style>
</head>
<body>
    <h2>Список продуктів</h2>
    <table>
        <tr>
            <th>Назва</th>
            <th>Ціна</th>
            <th>Кількість</th>
        </tr>
        {% for product in products %}
        <tr>
            <td>{{ product.title }}</td>
            <td>{{ product.price }}</td>
            <td>{{ product.product_qty }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">Немає продуктів.</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
