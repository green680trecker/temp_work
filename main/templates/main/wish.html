{% extends 'main/base.html' %}

{% block title %}
    Продукти
{% endblock %}

{% block body %}
    <h2>Список продуктів</h2>
    <table>
        <tr>
            <th>Назва</th>
            <th>Ціна</th>
            <th>Кількість</th>
        </tr>
        {% for product in products %}
        <tr>
            <td>{{ product.title }}</td>
            <td>{{ product.price }}</td>
            <td>{{ product.product_qty }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">Немає продуктів.</td>
        </tr>
        {% endfor %}
    </table>
{% endblock %}
